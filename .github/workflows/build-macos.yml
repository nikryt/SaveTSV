name: Build macOS App Multi-Arch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13  # Используем Intel Mac для x86_64
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-13
            python-version: '3.11'
          - arch: arm64
            runner: macos-latest
            python-version: '3.11'
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Используем более новую версию
        architecture: ${{ matrix.arch }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/pip
        key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile \
          --windowed \
          --name "GoogleSheetsSync-${{ matrix.arch }}" \
          --target-arch ${{ matrix.arch }} \
          --hidden-import=googleapiclient.discovery \
          --hidden-import=google_auth_oauthlib \
          --hidden-import=google.auth.transport.requests \
          --hidden-import=google.oauth2.credentials \
          --collect-all googleapiclient \
          --collect-all google_auth_oauthlib \
          main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoogleSheetsSync-${{ matrix.arch }}
        path: dist/GoogleSheetsSync-${{ matrix.arch }}
        retention-days: 30