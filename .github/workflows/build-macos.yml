name: Build macOS App with Beautiful DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Install create-dmg
      run: |
        brew install create-dmg

    - name: Build .app bundle
      run: |
        pyinstaller \
          --windowed \
          --name "GoogleSheetsSync" \
          --osx-bundle-identifier "com.googlesheets.sync" \
          --hidden-import=googleapiclient.discovery \
          --hidden-import=google_auth_oauthlib \
          --collect-all googleapiclient \
          --collect-all google_auth_oauthlib \
          main.py

    - name: Create beautiful DMG
      run: |
        create-dmg \
          --volname "Google Sheets Sync" \
          --volicon "icon.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "GoogleSheetsSync.app" 200 190 \
          --hide-extension "GoogleSheetsSync.app" \
          --app-drop-link 600 185 \
          "GoogleSheetsSync.dmg" \
          "dist/"

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: GoogleSheetsSync-DMG
        path: GoogleSheetsSync.dmg
        retention-days: 30


