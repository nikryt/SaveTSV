name: Build macOS App Multi-Arch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
      fail-fast: false  # Продолжать сборку даже если одна архитектура упала

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Обновлено до v4

    - name: Set up Python
      uses: actions/setup-python@v5  # Обновлено до v5
      with:
        python-version: '3.10'
        architecture: ${{ matrix.arch }}

    - name: Cache dependencies
      uses: actions/cache@v4  # Обновлено до v4
      with:
        path: ~/Library/Caches/pip
        key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile \
          --windowed \
          --name "GoogleSheetsSync-${{ matrix.arch }}" \
          --target-arch ${{ matrix.arch }} \
          --hidden-import=googleapiclient.discovery \
          --hidden-import=google_auth_oauthlib \
          --hidden-import=google.auth.transport.requests \
          --hidden-import=google.oauth2.credentials \
          --collect-all googleapiclient \
          --collect-all google_auth_oauthlib \
          main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4  # Обновлено до v4
      with:
        name: GoogleSheetsSync-${{ matrix.arch }}
        path: dist/GoogleSheetsSync-${{ matrix.arch }}
        retention-days: 30

  create-universal:
    needs: build-macos
    runs-on: macos-latest

    steps:
    - name: Download x86_64
      uses: actions/download-artifact@v4  # Обновлено до v4
      with:
        name: GoogleSheetsSync-x86_64
        path: artifacts/x86_64

    - name: Download arm64
      uses: actions/download-artifact@v4  # Обновлено до v4
      with:
        name: GoogleSheetsSync-arm64
        path: artifacts/arm64

    - name: Create universal binary
      run: |
        # Проверяем наличие файлов
        ls -la artifacts/x86_64/
        ls -la artifacts/arm64/
        
        # Создаем universal binary
        lipo -create \
          artifacts/x86_64/GoogleSheetsSync-x86_64 \
          artifacts/arm64/GoogleSheetsSync-arm64 \
          -output GoogleSheetsSync-universal
        
        # Проверяем результат
        file GoogleSheetsSync-universal

    - name: Upload universal binary
      uses: actions/upload-artifact@v4  # Обновлено до v4
      with:
        name: GoogleSheetsSync-universal
        path: GoogleSheetsSync-universal
        retention-days: 30